name: Nexus Genomics - CI/CD Pipeline

on:
  push:
    branches: [ main, audit-fixes ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint check
        run: npm run lint
        
      # - name: Run Tests
      #   run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/audit-fixes')
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: actions/setup-docker-action@v2 # Note: In a real repo, use docker/setup-buildx-action@v3
        
      - name: Build Docker Image
        run: docker build -t nexus-lab:latest .
