<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; font-family: 'Inter', sans-serif;">
    <defs>
        <style>
            .title { fill: #00e5ff; font-size: 16px; font-weight: bold; font-family: 'JetBrains Mono', monospace; }
            .text { fill: #ffffff; font-size: 14px; }
            .muted { fill: rgba(255, 255, 255, 0.6); font-size: 12px; }
            .line { stroke: #ffffff; stroke-width: 2; }
            .hbond { stroke: #00e5ff; stroke-width: 2; stroke-dasharray: 4 4; }
            .box { fill: rgba(0, 229, 255, 0.1); stroke: #00e5ff; stroke-width: 1; rx: 6px; }
        </style>
    </defs>
    
    <text x="20" y="30" class="title">The Computational Pipeline</text>
    
    <rect x="100" y="50" width="200" height="40" class="box" />
    <text x="135" y="75" class="text">1. Physics &amp; Chemistry</text>
    <line x1="200" y1="90" x2="200" y2="110" stroke="#ffffff" stroke-width="2" />

    <rect x="100" y="110" width="200" height="40" class="box" />
    <text x="135" y="135" class="text">2. Genome Stability</text>
    <line x1="200" y1="150" x2="200" y2="170" stroke="#ffffff" stroke-width="2" />

    <rect x="100" y="170" width="200" height="40" class="box" />
    <text x="155" y="195" class="text">3. Sequencing</text>
    <line x1="200" y1="210" x2="200" y2="230" stroke="#ffffff" stroke-width="2" />

    <rect x="100" y="230" width="200" height="40" class="box" />
    <text x="145" y="255" class="text">4. Variant Calling</text>
    <line x1="200" y1="270" x2="200" y2="290" stroke="#ffffff" stroke-width="2" />

    <rect x="100" y="290" width="200" height="40" class="box" fill="rgba(0, 229, 255, 0.3)" />
    <text x="125" y="315" class="text" font-weight="bold">Biological Discovery</text>

</svg>