<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; font-family: 'Inter', sans-serif;">
    <defs>
        <style>
            .title { fill: #00e5ff; font-size: 16px; font-weight: bold; font-family: 'JetBrains Mono', monospace; }
            .text { fill: #ffffff; font-size: 14px; }
            .muted { fill: rgba(255, 255, 255, 0.6); font-size: 12px; }
            .line { stroke: #ffffff; stroke-width: 2; }
            .hbond { stroke: #00e5ff; stroke-width: 2; stroke-dasharray: 4 4; }
            .box { fill: rgba(0, 229, 255, 0.1); stroke: #00e5ff; stroke-width: 1; rx: 6px; }
        </style>
    </defs>
    
    <text x="20" y="30" class="title">Biology's Layered Defense</text>
    
    <polygon points="50,60 350,60 300,100 100,100" fill="rgba(0, 229, 255, 0.1)" stroke="#00e5ff" />
    <text x="110" y="85" class="text">1. Chemistry (1 in 10³)</text>

    <polygon points="100,110 300,110 250,150 150,150" fill="rgba(0, 229, 255, 0.2)" stroke="#00e5ff" />
    <text x="120" y="135" class="text">2. Polymerase (1 in 10⁵)</text>

    <polygon points="150,160 250,160 220,200 180,200" fill="rgba(0, 229, 255, 0.3)" stroke="#00e5ff" />
    <text x="115" y="185" class="text">3. Proofreading (1 in 10⁷)</text>

    <polygon points="180,210 220,210 205,250 195,250" fill="rgba(0, 229, 255, 0.4)" stroke="#00e5ff" />
    <text x="70" y="235" class="text">4. Mismatch Repair (1 in 10¹⁰)</text>
    
    <line x1="200" y1="260" x2="200" y2="280" stroke="#ffffff" stroke-width="2" />
    <text x="100" y="295" class="title">High-Fidelity Genome</text>

</svg>