<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; font-family: 'Inter', sans-serif;">
    <defs>
        <style>
            .title { fill: #00e5ff; font-size: 16px; font-weight: bold; font-family: 'JetBrains Mono', monospace; }
            .text { fill: #ffffff; font-size: 14px; }
            .muted { fill: rgba(255, 255, 255, 0.6); font-size: 12px; }
            .line { stroke: #ffffff; stroke-width: 2; }
            .hbond { stroke: #00e5ff; stroke-width: 2; stroke-dasharray: 4 4; }
            .box { fill: rgba(0, 229, 255, 0.1); stroke: #00e5ff; stroke-width: 1; rx: 6px; }
        </style>
    </defs>
    
    <text x="20" y="30" class="title">Drug Docking Simulation</text>
    <path d="M 50 200 C 50 100, 150 50, 250 100 C 350 150, 300 250, 200 250 Z" fill="rgba(255,255,255,0.05)" stroke="#ffffff" stroke-dasharray="5 5" stroke-width="2"/>
    <text x="70" y="240" class="muted">Protein Hydrophobic Pocket</text>
    
    <polygon points="150,150 200,120 250,160 220,200 170,210" class="box" />
    <text x="180" y="170" class="text" fill="#00e5ff">Drug</text>

    <line x1="250" y1="160" x2="280" y2="180" class="hbond" />
    <text x="290" y="190" class="muted">H-Bond</text>

</svg>