<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; font-family: 'Inter', sans-serif;">
    <defs>
        <style>
            .title { fill: #00e5ff; font-size: 16px; font-weight: bold; font-family: 'JetBrains Mono', monospace; }
            .text { fill: #ffffff; font-size: 14px; }
            .muted { fill: rgba(255, 255, 255, 0.6); font-size: 12px; }
            .line { stroke: #ffffff; stroke-width: 2; }
            .hbond { stroke: #00e5ff; stroke-width: 2; stroke-dasharray: 4 4; }
            .box { fill: rgba(0, 229, 255, 0.1); stroke: #00e5ff; stroke-width: 1; rx: 6px; }
        </style>
    </defs>
    
    <text x="20" y="30" class="title">1. Hydrogen Bonding</text>
    <line x1="40" y1="60" x2="160" y2="60" class="hbond" />
    <line x1="40" y1="80" x2="160" y2="80" class="hbond" />
    <text x="40" y="110" class="muted">Provides Specificity</text>
    
    <text x="220" y="30" class="title">2. Base Stacking</text>
    <ellipse cx="270" cy="60" rx="40" ry="15" fill="rgba(0, 229, 255, 0.2)" stroke="#00e5ff" />
    <ellipse cx="270" cy="75" rx="40" ry="15" fill="rgba(0, 229, 255, 0.2)" stroke="#00e5ff" />
    <ellipse cx="270" cy="90" rx="40" ry="15" fill="rgba(0, 229, 255, 0.2)" stroke="#00e5ff" />
    <text x="220" y="125" class="muted">Provides Stability (pi-pi stacking)</text>

    <text x="420" y="30" class="title">3. Hydrophobic Effect</text>
    <rect x="440" y="50" width="80" height="60" class="box" />
    <text x="450" y="85" class="text">Bases</text>
    <text x="410" y="75" fill="#4dabf7" font-size="12">H2O</text>
    <text x="530" y="65" fill="#4dabf7" font-size="12">H2O</text>
    <text x="470" y="130" fill="#4dabf7" font-size="12">H2O</text>
    <text x="420" y="145" class="muted">Water excluded from interior</text>

</svg>