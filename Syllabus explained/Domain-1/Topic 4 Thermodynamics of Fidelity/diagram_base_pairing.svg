<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; font-family: 'Inter', sans-serif;">
    <defs>
        <style>
            .title { fill: #00e5ff; font-size: 16px; font-weight: bold; font-family: 'JetBrains Mono', monospace; }
            .text { fill: #ffffff; font-size: 14px; }
            .muted { fill: rgba(255, 255, 255, 0.6); font-size: 12px; }
            .line { stroke: #ffffff; stroke-width: 2; }
            .hbond { stroke: #00e5ff; stroke-width: 2; stroke-dasharray: 4 4; }
            .box { fill: rgba(0, 229, 255, 0.1); stroke: #00e5ff; stroke-width: 1; rx: 6px; }
        </style>
    </defs>
    
    <text x="20" y="30" class="title">Adenine - Thymine (2 H-Bonds)</text>
    <rect x="50" y="60" width="100" height="60" class="box" />
    <text x="90" y="95" class="text" font-size="20">A</text>
    <rect x="250" y="60" width="100" height="60" class="box" />
    <text x="290" y="95" class="text" font-size="20">T</text>
    <line x1="150" y1="75" x2="250" y2="75" class="hbond" />
    <line x1="150" y1="105" x2="250" y2="105" class="hbond" />
    
    <text x="20" y="160" class="title">Guanine - Cytosine (3 H-Bonds)</text>
    <rect x="50" y="190" width="100" height="60" class="box" />
    <text x="90" y="225" class="text" font-size="20">G</text>
    <rect x="250" y="190" width="100" height="60" class="box" />
    <text x="290" y="225" class="text" font-size="20">C</text>
    <line x1="150" y1="200" x2="250" y2="200" class="hbond" />
    <line x1="150" y1="220" x2="250" y2="220" class="hbond" />
    <line x1="150" y1="240" x2="250" y2="240" class="hbond" />

</svg>