<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background-color: #0a0b10; font-family: 'Inter', sans-serif;">
<defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>
<style>
    .text-title { font-size: 24px; fill: #ffffff; font-weight: bold; font-family: 'Cinzel', serif; }
    .text-main { font-size: 16px; fill: #d1d5db; }
    .text-math { font-size: 20px; fill: #ffd54f; font-family: 'JetBrains Mono', monospace; }
    .text-pink { font-size: 18px; fill: #ff007f; font-weight: bold; }
    .text-cyan { font-size: 18px; fill: #00e5ff; font-weight: bold; }
</style>

    <text x="400" y="40" class="text-title" text-anchor="middle">Damage vs. Mutation (The Replication Pathway)</text>
    
    <g transform="translate(100, 150)">
        <text x="50" y="0" class="text-cyan" text-anchor="middle">Normal State</text>
        <rect x="0" y="20" width="100" height="40" fill="#1a1c29" stroke="#00e5ff" stroke-width="2"/>
        <text x="50" y="45" class="text-math" fill="#00e5ff" text-anchor="middle">C : G</text>
        
        <line x1="120" y1="40" x2="220" y2="40" stroke="#d1d5db" stroke-width="2"/>
        <polygon points="220,40 210,35 210,45" fill="#d1d5db"/>
        <text x="170" y="25" class="text-main" text-anchor="middle">Deamination</text>
        
        <text x="270" y="0" class="text-main" fill="#ff4757" font-weight="bold" text-anchor="middle">Transient Damage</text>
        <rect x="220" y="20" width="100" height="40" fill="#1a1c29" stroke="#ff4757" stroke-width="2" filter="url(#glow)"/>
        <text x="270" y="45" class="text-math" fill="#ff4757" text-anchor="middle">U : G</text>
        
        <line x1="340" y1="40" x2="440" y2="40" stroke="#d1d5db" stroke-width="2"/>
        <polygon points="440,40 430,35 430,45" fill="#d1d5db"/>
        <text x="390" y="25" class="text-main" text-anchor="middle">Replication</text>
        
        <text x="490" y="0" class="text-main" fill="#ffd54f" font-weight="bold" text-anchor="middle">1st Generation</text>
        <rect x="440" y="20" width="100" height="40" fill="#1a1c29" stroke="#ffd54f" stroke-width="2"/>
        <text x="490" y="45" class="text-math" fill="#ffd54f" text-anchor="middle">U : A</text>
        
        <line x1="560" y1="40" x2="660" y2="40" stroke="#d1d5db" stroke-width="2"/>
        <polygon points="660,40 650,35 650,45" fill="#d1d5db"/>
        <text x="610" y="25" class="text-main" text-anchor="middle">Replication</text>
        
        <text x="710" y="0" class="text-pink" text-anchor="middle">Permanent Mutation</text>
        <rect x="660" y="20" width="100" height="40" fill="#1a1c29" stroke="#ff007f" stroke-width="2" filter="url(#glow)"/>
        <text x="710" y="45" class="text-math" fill="#ff007f" text-anchor="middle">T : A</text>
    </g>
</svg>