<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background-color: #0a0b10; font-family: 'Inter', sans-serif;">
<defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>
<style>
    .text-title { font-size: 24px; fill: #ffffff; font-weight: bold; font-family: 'Cinzel', serif; }
    .text-main { font-size: 16px; fill: #d1d5db; }
    .text-math { font-size: 20px; fill: #ffd54f; font-family: 'JetBrains Mono', monospace; }
    .text-pink { font-size: 18px; fill: #ff007f; font-weight: bold; }
    .text-cyan { font-size: 18px; fill: #00e5ff; font-weight: bold; }
</style>

    <text x="400" y="40" class="text-title" text-anchor="middle">The 96-Channel Mutation Spectrum</text>
    
    <g transform="translate(50, 100)">
        <text x="350" y="0" class="text-main" text-anchor="middle">To find mutational signatures, we look at the flanking sequence context.</text>
        
        <rect x="150" y="40" width="400" height="80" rx="10" fill="#1a1c29" stroke="#374151" stroke-width="2"/>
        <text x="220" y="90" class="text-math" fill="#00e5ff" text-anchor="middle">5' - A</text>
        <text x="350" y="90" class="text-math" fill="#ff007f" font-size="30px" font-weight="bold" text-anchor="middle" filter="url(#glow)">[ C &gt; T ]</text>
        <text x="480" y="90" class="text-math" fill="#ffd54f" text-anchor="middle">G - 3'</text>
        
        <!-- Multipliers -->
        <g transform="translate(100, 180)">
            <rect x="0" y="0" width="120" height="60" rx="5" fill="#050510" stroke="#00e5ff" stroke-width="2"/>
            <text x="60" y="25" class="text-main" fill="#00e5ff" text-anchor="middle" font-weight="bold">4</text>
            <text x="60" y="45" class="text-main" font-size="12px" text-anchor="middle">Upstream Bases</text>
            
            <text x="150" y="35" class="text-math" text-anchor="middle">×</text>
            
            <rect x="180" y="0" width="140" height="60" rx="5" fill="#050510" stroke="#ff007f" stroke-width="2"/>
            <text x="250" y="25" class="text-main" fill="#ff007f" text-anchor="middle" font-weight="bold">6</text>
            <text x="250" y="45" class="text-main" font-size="12px" text-anchor="middle">Canonical Subtypes</text>
            
            <text x="350" y="35" class="text-math" text-anchor="middle">×</text>
            
            <rect x="380" y="0" width="120" height="60" rx="5" fill="#050510" stroke="#ffd54f" stroke-width="2"/>
            <text x="440" y="25" class="text-main" fill="#ffd54f" text-anchor="middle" font-weight="bold">4</text>
            <text x="440" y="45" class="text-main" font-size="12px" text-anchor="middle">Downstream Bases</text>
            
            <text x="540" y="35" class="text-math" text-anchor="middle">=</text>
            
            <rect x="580" y="0" width="80" height="60" rx="5" fill="#1a1c29" stroke="#fff" stroke-width="3" filter="url(#glow)"/>
            <text x="620" y="35" class="text-math" fill="#fff" text-anchor="middle" font-size="24px">96</text>
        </g>
    </g>
</svg>