<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background-color: #0a0b10; font-family: 'Inter', sans-serif;">
<defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>
<style>
    .text-title { font-size: 24px; fill: #ffffff; font-weight: bold; font-family: 'Cinzel', serif; }
    .text-main { font-size: 16px; fill: #d1d5db; }
    .text-math { font-size: 20px; fill: #ffd54f; font-family: 'JetBrains Mono', monospace; }
    .text-pink { font-size: 18px; fill: #ff007f; font-weight: bold; }
    .text-cyan { font-size: 18px; fill: #00e5ff; font-weight: bold; }
</style>

    <text x="400" y="40" class="text-title" text-anchor="middle">The Bioinformatics Pipeline as a Chain of Filters</text>
    
    <g transform="translate(100, 70)">
        <rect x="0" y="0" width="250" height="40" fill="#1a1c29" stroke="#00e5ff" stroke-width="2" rx="5"/>
        <text x="125" y="25" class="text-cyan" text-anchor="middle">1. REAL DNA (Chemistry)</text>
        
        <line x1="125" y1="40" x2="125" y2="80" stroke="#d1d5db" stroke-width="2"/>
        <polygon points="125,80 120,70 130,70" fill="#d1d5db"/>
        
        <rect x="0" y="80" width="250" height="40" fill="#1a1c29" stroke="#ff007f" stroke-width="2" rx="5"/>
        <text x="125" y="105" class="text-pink" text-anchor="middle">2. LIBRARY (Biology)</text>
        
        <line x1="125" y1="120" x2="125" y2="160" stroke="#d1d5db" stroke-width="2"/>
        <polygon points="125,160 120,150 130,150" fill="#d1d5db"/>
        
        <rect x="0" y="160" width="250" height="40" fill="#1a1c29" stroke="#ffd54f" stroke-width="2" rx="5"/>
        <text x="125" y="185" class="text-main" fill="#ffd54f" font-weight="bold" text-anchor="middle">3. INSTRUMENT (Physics)</text>
        
        <line x1="250" y1="180" x2="350" y2="180" stroke="#d1d5db" stroke-width="2"/>
        <polygon points="350,180 340,175 340,185" fill="#d1d5db"/>
        
        <rect x="350" y="160" width="250" height="40" fill="#1a1c29" stroke="#4ade80" stroke-width="2" rx="5"/>
        <text x="475" y="185" class="text-main" fill="#4ade80" font-weight="bold" text-anchor="middle">4. BASE CALLS (FASTQ)</text>
        
        <line x1="475" y1="160" x2="475" y2="120" stroke="#d1d5db" stroke-width="2"/>
        <polygon points="475,120 470,130 480,130" fill="#d1d5db"/>
        
        <rect x="350" y="80" width="250" height="40" fill="#1a1c29" stroke="#a78bfa" stroke-width="2" rx="5"/>
        <text x="475" y="105" class="text-main" fill="#a78bfa" font-weight="bold" text-anchor="middle">5. ALIGNMENT (BAM)</text>
        
        <line x1="475" y1="80" x2="475" y2="40" stroke="#d1d5db" stroke-width="2"/>
        <polygon points="475,40 470,50 480,50" fill="#d1d5db"/>
        
        <rect x="350" y="0" width="250" height="40" fill="#1a1c29" stroke="#ff4757" stroke-width="2" rx="5"/>
        <text x="475" y="25" class="text-main" fill="#ff4757" font-weight="bold" text-anchor="middle">6. VARIANT CALL (VCF)</text>
        
        <!-- Descriptive text side pane -->
        <g transform="translate(10, 240)">
            <text x="0" y="0" class="text-main">Every stage is a filter. If DNA is damaged in Step 1 (deamination),</text>
            <text x="0" y="25" class="text-main">the algorithm in Step 6 will mathematically execute correctly,</text>
            <text x="0" y="50" class="text-main">but yield a false biological conclusion.</text>
        </g>
    </g>
</svg>