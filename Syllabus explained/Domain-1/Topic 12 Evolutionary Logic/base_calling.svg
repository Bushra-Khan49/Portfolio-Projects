<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background-color: #0a0b10; font-family: 'Inter', sans-serif;">
<defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComponentTransfer in="blur" result="glow1">
            <feFuncR type="linear" slope="255"/>
            <feFuncG type="linear" slope="0"/>
            <feFuncB type="linear" slope="127"/>
        </feComponentTransfer>
        <feMerge>
            <feMergeNode in="glow1"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
</defs>
<style>
    .text-title { font-size: 24px; fill: #ffffff; font-weight: bold; font-family: 'Cinzel', serif; }
    .text-main { font-size: 16px; fill: #d1d5db; }
    .text-math { font-size: 20px; fill: #ffd54f; font-family: 'JetBrains Mono', monospace; }
    .text-pink { font-size: 18px; fill: #ff007f; font-weight: bold; }
    .text-cyan { font-size: 18px; fill: #00e5ff; font-weight: bold; }
</style>

    <text x="400" y="40" class="text-title" text-anchor="middle">Base-Calling: From Analog Signal to Digital Probability</text>
    
    <!-- Waveforms -->
    <g transform="translate(50, 100)">
        <path d="M 0 50 Q 25 10 50 50 T 100 50 T 150 10 T 200 50" fill="none" stroke="#ff007f" stroke-width="3" filter="url(#glow)"/>
        <text x="-10" y="55" class="text-pink" text-anchor="end">A</text>
        
        <path d="M 0 90 Q 25 40 50 90 T 100 90 T 150 80 T 200 90" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"/>
        <text x="-10" y="95" class="text-cyan" text-anchor="end">C</text>

        <path d="M 0 130 Q 25 120 50 130 T 100 60 T 150 130 T 200 130" fill="none" stroke="#ffd54f" stroke-width="3" filter="url(#glow)"/>
        <text x="-10" y="135" class="text-main" fill="#ffd54f" font-weight="bold" text-anchor="end">G</text>
        
        <path d="M 0 170 Q 25 160 50 170 T 100 170 T 150 170 T 200 120" fill="none" stroke="#4ade80" stroke-width="3" filter="url(#glow)"/>
        <text x="-10" y="175" class="text-main" fill="#4ade80" font-weight="bold" text-anchor="end">T</text>
        
        <!-- Sampling Line -->
        <line x1="100" y1="30" x2="100" y2="190" stroke="#ffffff" stroke-width="2" stroke-dasharray="5,5"/>
        <text x="100" y="210" class="text-main" text-anchor="middle">Sampling Cycle (t)</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(280, 200)">
        <line x1="0" y1="0" x2="80" y2="0" stroke="#d1d5db" stroke-width="3"/>
        <polygon points="80,0 70,-7 70,7" fill="#d1d5db"/>
        <text x="40" y="-15" class="text-main" text-anchor="middle">Neural Net</text>
    </g>

    <!-- Probability & Phred -->
    <g transform="translate(420, 100)">
        <rect x="0" y="0" width="300" height="180" rx="10" fill="#1a1c29" stroke="#374151" stroke-width="2"/>
        <text x="150" y="30" class="text-pink" text-anchor="middle">Inferred Base: G</text>
        
        <text x="20" y="70" class="text-main">P(Error) = 0.001</text>
        <text x="20" y="100" class="text-main">Confidence = 99.9%</text>
        
        <rect x="20" y="120" width="260" height="40" fill="#050510" rx="5"/>
        <text x="150" y="145" class="text-math" text-anchor="middle">Q = -10 × log₁₀(P)</text>
        <text x="150" y="195" class="text-cyan" text-anchor="middle">Phred Score: Q30</text>
    </g>
</svg>