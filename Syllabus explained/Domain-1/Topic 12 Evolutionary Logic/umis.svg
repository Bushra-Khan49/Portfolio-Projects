<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background-color: #0a0b10; font-family: 'Inter', sans-serif;">
<defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>
<style>
    .text-title { font-size: 24px; fill: #ffffff; font-weight: bold; font-family: 'Cinzel', serif; }
    .text-main { font-size: 16px; fill: #d1d5db; }
    .text-math { font-size: 20px; fill: #ffd54f; font-family: 'JetBrains Mono', monospace; }
    .text-pink { font-size: 18px; fill: #ff007f; font-weight: bold; }
    .text-cyan { font-size: 18px; fill: #00e5ff; font-weight: bold; }
</style>

    <text x="400" y="40" class="text-title" text-anchor="middle">Unique Molecular Identifiers (UMIs) & Deduplication</text>
    
    <g transform="translate(50, 100)">
        <!-- PCR Amplification Side -->
        <text x="150" y="0" class="text-pink" text-anchor="middle">PCR Duplicates (Same UMI)</text>
        <rect x="20" y="20" width="260" height="20" fill="#1a1c29" stroke="#ff007f" stroke-width="2"/>
        <rect x="20" y="20" width="60" height="20" fill="#ff007f"/>
        <text x="50" y="35" class="text-main" fill="#fff" font-family="monospace" text-anchor="middle">ACTG</text>
        
        <rect x="20" y="60" width="260" height="20" fill="#1a1c29" stroke="#ff007f" stroke-width="2"/>
        <rect x="20" y="60" width="60" height="20" fill="#ff007f"/>
        <text x="50" y="75" class="text-main" fill="#fff" font-family="monospace" text-anchor="middle">ACTG</text>
        
        <rect x="20" y="100" width="260" height="20" fill="#1a1c29" stroke="#ff007f" stroke-width="2"/>
        <rect x="20" y="100" width="60" height="20" fill="#ff007f"/>
        <text x="50" y="115" class="text-main" fill="#fff" font-family="monospace" text-anchor="middle">ACTG</text>
        
        <!-- Deduplication process -->
        <line x1="300" y1="70" x2="450" y2="70" stroke="#d1d5db" stroke-width="3" stroke-dasharray="5,5"/>
        <polygon points="450,70 440,63 440,77" fill="#d1d5db"/>
        <text x="375" y="60" class="text-main" text-anchor="middle">Computational</text>
        <text x="375" y="90" class="text-main" text-anchor="middle">Deduplication</text>
        
        <!-- True Biological Molecules -->
        <text x="600" y="0" class="text-cyan" text-anchor="middle">Collapsed to 1 True Observation</text>
        <rect x="470" y="60" width="260" height="20" fill="#1a1c29" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"/>
        <rect x="470" y="60" width="60" height="20" fill="#00e5ff"/>
        <text x="500" y="75" class="text-main" fill="#fff" font-family="monospace" text-anchor="middle">ACTG</text>
        
        <rect x="50" y="200" width="700" height="60" rx="8" fill="#050510" stroke="#374151" stroke-width="2"/>
        <text x="400" y="225" class="text-main" text-anchor="middle">Without UMIs: Caller sees 3 independent reads supporting a variant (False confidence).</text>
        <text x="400" y="245" class="text-main" text-anchor="middle">With UMIs: Caller correctly sees 1 true physical molecule.</text>
    </g>
</svg>