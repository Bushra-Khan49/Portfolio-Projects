<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background-color: #0a0b10; font-family: 'Inter', sans-serif;">
<defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComponentTransfer in="blur" result="glow1">
            <feFuncR type="linear" slope="255"/>
            <feFuncG type="linear" slope="0"/>
            <feFuncB type="linear" slope="127"/>
        </feComponentTransfer>
        <feMerge>
            <feMergeNode in="glow1"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
</defs>
<style>
    .text-title { font-size: 24px; fill: #ffffff; font-weight: bold; font-family: 'Cinzel', serif; }
    .text-main { font-size: 16px; fill: #d1d5db; }
    .text-math { font-size: 20px; fill: #ffd54f; font-family: 'JetBrains Mono', monospace; }
    .text-pink { font-size: 18px; fill: #ff007f; font-weight: bold; }
    .text-cyan { font-size: 18px; fill: #00e5ff; font-weight: bold; }
</style>

    <text x="400" y="40" class="text-title" text-anchor="middle">Reverse-Complement Normalization</text>
    
    <g transform="translate(100, 100)">
        <!-- Forward Strand -->
        <text x="0" y="30" class="text-main" font-weight="bold">Forward Strand (5' → 3')</text>
        <line x1="0" y1="50" x2="600" y2="50" stroke="#00e5ff" stroke-width="4"/>
        <text x="150" y="45" class="text-main">A</text>
        <circle cx="300" cy="50" r="15" fill="#ff007f"/>
        <text x="300" y="55" class="text-title" font-size="16px" text-anchor="middle">C</text>
        <text x="450" y="45" class="text-main">G</text>
        
        <text x="300" y="15" class="text-pink" text-anchor="middle">Mutation: C → T</text>
        
        <!-- Base Pairs -->
        <line x1="150" y1="50" x2="150" y2="150" stroke="#d1d5db" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="300" y1="50" x2="300" y2="150" stroke="#d1d5db" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="450" y1="50" x2="450" y2="150" stroke="#d1d5db" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- Reverse Strand -->
        <text x="0" y="190" class="text-main" font-weight="bold">Reverse Strand (3' ← 5')</text>
        <line x1="0" y1="150" x2="600" y2="150" stroke="#00e5ff" stroke-width="4"/>
        <text x="150" y="170" class="text-main">T</text>
        <circle cx="300" cy="150" r="15" fill="#ffd54f"/>
        <text x="300" y="155" class="text-title" font-size="16px" text-anchor="middle" fill="#000">G</text>
        <text x="450" y="170" class="text-main">C</text>
        
        <text x="300" y="210" class="text-main" fill="#ffd54f" text-anchor="middle">Physical Equivalent: G → A</text>
    </g>
    
    <rect x="150" y="330" width="500" height="40" rx="5" fill="#1a1c29" stroke="#374151" stroke-width="2"/>
    <text x="400" y="355" class="text-main" text-anchor="middle" font-weight="bold">Algorithm collapses 12 substitutions → 6 canonical classes</text>
</svg>