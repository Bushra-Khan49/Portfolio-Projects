<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background-color: #0a0b10; font-family: 'Inter', sans-serif;">
<defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComponentTransfer in="blur" result="glow1">
            <feFuncR type="linear" slope="255"/>
            <feFuncG type="linear" slope="0"/>
            <feFuncB type="linear" slope="127"/>
        </feComponentTransfer>
        <feMerge>
            <feMergeNode in="glow1"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
</defs>
<style>
    .text-title { font-size: 24px; fill: #ffffff; font-weight: bold; font-family: 'Cinzel', serif; }
    .text-main { font-size: 16px; fill: #d1d5db; }
    .text-math { font-size: 20px; fill: #ffd54f; font-family: 'JetBrains Mono', monospace; }
    .text-pink { font-size: 18px; fill: #ff007f; font-weight: bold; }
    .text-cyan { font-size: 18px; fill: #00e5ff; font-weight: bold; }
</style>

    <text x="400" y="40" class="text-title" text-anchor="middle">Alignment Errors: The Pseudogene Trap</text>
    
    <g transform="translate(50, 100)">
        <!-- Reference Genome -->
        <text x="0" y="0" class="text-main" font-weight="bold">Reference Genome</text>
        <line x1="0" y1="30" x2="700" y2="30" stroke="#d1d5db" stroke-width="4"/>
        
        <!-- Target Gene -->
        <rect x="100" y="15" width="200" height="30" fill="#00e5ff" opacity="0.3"/>
        <text x="200" y="10" class="text-cyan" text-anchor="middle">Target Gene</text>
        <text x="200" y="25" class="text-main" text-anchor="middle" font-family="monospace">...ATC G CTA...</text>
        
        <!-- Pseudogene -->
        <rect x="450" y="15" width="200" height="30" fill="#ff007f" opacity="0.3"/>
        <text x="550" y="10" class="text-pink" text-anchor="middle">Pseudogene (Duplication)</text>
        <text x="550" y="25" class="text-main" text-anchor="middle" font-family="monospace">...ATC T CTA...</text>
        
        <!-- Sequencing Read -->
        <text x="0" y="130" class="text-main" font-weight="bold">Sequencing Read (originated from Pseudogene)</text>
        <rect x="480" y="100" width="140" height="20" fill="#ff007f" rx="3"/>
        <text x="550" y="115" class="text-main" text-anchor="middle" fill="#fff" font-family="monospace">ATC T CTA</text>
        
        <!-- Incorrect Mapping Arrow -->
        <path d="M 550 100 Q 375 60 200 100" fill="none" stroke="#ffd54f" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
        <polygon points="200,100 207,90 193,90" fill="#ffd54f"/>
        <text x="375" y="70" class="text-main" fill="#ffd54f" text-anchor="middle" font-weight="bold">Incorrectly mapped due to high sequence similarity</text>
        
        <!-- Resulting VCF -->
        <rect x="100" y="180" width="600" height="70" rx="8" fill="#1a1c29" stroke="#ff4757" stroke-width="2"/>
        <text x="400" y="210" class="text-main" fill="#ff4757" text-anchor="middle" font-weight="bold">Variant Caller output: Heterozygous Mutation (G → T)</text>
        <text x="400" y="235" class="text-main" text-anchor="middle">Conclusion: FALSE POSITIVE generated entirely by computational alignment error.</text>
    </g>
</svg>