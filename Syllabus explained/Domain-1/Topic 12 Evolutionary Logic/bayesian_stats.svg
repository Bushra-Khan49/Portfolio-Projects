<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background-color: #0a0b10; font-family: 'Inter', sans-serif;">
<defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComponentTransfer in="blur" result="glow1">
            <feFuncR type="linear" slope="255"/>
            <feFuncG type="linear" slope="0"/>
            <feFuncB type="linear" slope="127"/>
        </feComponentTransfer>
        <feMerge>
            <feMergeNode in="glow1"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
</defs>
<style>
    .text-title { font-size: 24px; fill: #ffffff; font-weight: bold; font-family: 'Cinzel', serif; }
    .text-main { font-size: 16px; fill: #d1d5db; }
    .text-math { font-size: 20px; fill: #ffd54f; font-family: 'JetBrains Mono', monospace; }
    .text-pink { font-size: 18px; fill: #ff007f; font-weight: bold; }
    .text-cyan { font-size: 18px; fill: #00e5ff; font-weight: bold; }
</style>

    <text x="400" y="40" class="text-title" text-anchor="middle">Bayesian Statistics in Variant Calling</text>
    
    <!-- Graph -->
    <g transform="translate(100, 250)">
        <!-- Axes -->
        <line x1="0" y1="0" x2="600" y2="0" stroke="#d1d5db" stroke-width="2"/>
        <line x1="0" y1="0" x2="0" y2="-150" stroke="#d1d5db" stroke-width="2"/>
        <text x="300" y="40" class="text-main" text-anchor="middle">Allele Fraction / Signal Intensity</text>
        <text x="-30" y="-75" class="text-main" text-anchor="middle" transform="rotate(-90, -30, -75)">Probability Density</text>
        
        <!-- Noise Curve -->
        <path d="M 0 0 Q 100 0 150 -100 T 300 0" fill="rgba(0,229,255,0.2)" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"/>
        <text x="150" y="-120" class="text-cyan" text-anchor="middle">P(D | ¬V) Noise</text>
        
        <!-- Signal Curve -->
        <path d="M 200 0 Q 350 0 400 -120 T 600 0" fill="rgba(255,0,127,0.2)" stroke="#ff007f" stroke-width="3" filter="url(#glow)"/>
        <text x="400" y="-140" class="text-pink" text-anchor="middle">P(D | V) Signal</text>
        
        <!-- Threshold -->
        <line x1="275" y1="0" x2="275" y2="-150" stroke="#ffd54f" stroke-width="2" stroke-dasharray="5,5"/>
        <text x="275" y="-165" class="text-main" fill="#ffd54f" text-anchor="middle">Likelihood Ratio Threshold</text>
    </g>

    <!-- Equation -->
    <g transform="translate(250, 320)">
        <rect x="0" y="0" width="300" height="60" rx="8" fill="#1a1c29" stroke="#374151" stroke-width="2"/>
        <text x="150" y="35" class="text-math" text-anchor="middle">P(V|D) = [P(D|V)P(V)] / P(D)</text>
    </g>
</svg>