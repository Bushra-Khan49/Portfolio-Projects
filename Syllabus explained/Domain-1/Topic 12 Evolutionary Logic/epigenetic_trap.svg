<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background-color: #0a0b10; font-family: 'Inter', sans-serif;">
<defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComponentTransfer in="blur" result="glow1">
            <feFuncR type="linear" slope="255"/>
            <feFuncG type="linear" slope="0"/>
            <feFuncB type="linear" slope="127"/>
        </feComponentTransfer>
        <feMerge>
            <feMergeNode in="glow1"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
</defs>
<style>
    .text-title { font-size: 24px; fill: #ffffff; font-weight: bold; font-family: 'Cinzel', serif; }
    .text-main { font-size: 16px; fill: #d1d5db; }
    .text-math { font-size: 20px; fill: #ffd54f; font-family: 'JetBrains Mono', monospace; }
    .text-pink { font-size: 18px; fill: #ff007f; font-weight: bold; }
    .text-cyan { font-size: 18px; fill: #00e5ff; font-weight: bold; }
</style>

    <text x="400" y="40" class="text-title" text-anchor="middle">The Epigenetic Trap: 5-Methylcytosine Deamination</text>
    
    <!-- 5mC Molecule Mockup -->
    <g transform="translate(150, 150)">
        <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="#00e5ff" stroke-width="4" filter="url(#glow)"/>
        <text x="-43" y="-35" class="text-main" fill="#00e5ff" text-anchor="end">NH₂</text>
        <text x="43" y="-35" class="text-main" fill="#ff007f" font-weight="bold" filter="url(#glow)">CH₃ (Methyl Tag)</text>
        <text x="-43" y="35" class="text-main" fill="#00e5ff" text-anchor="end">N</text>
        <text x="0" y="80" class="text-title" fill="#00e5ff" text-anchor="middle">5-Methylcytosine</text>
        <text x="0" y="110" class="text-main" text-anchor="middle">Normal pairing: G</text>
    </g>

    <!-- Reaction Arrow -->
    <g transform="translate(320, 150)">
        <line x1="0" y1="0" x2="160" y2="0" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>
        <polygon points="160,0 145,-7 145,7" fill="#d1d5db"/>
        <text x="80" y="-15" class="text-main" text-anchor="middle">Hydrolytic Deamination</text>
        <text x="80" y="25" class="text-main" fill="#ff4757" text-anchor="middle">- NH₃</text>
    </g>

    <!-- Thymine Molecule Mockup -->
    <g transform="translate(650, 150)">
        <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="#ff007f" stroke-width="4" filter="url(#glow)"/>
        <text x="-43" y="-35" class="text-main" fill="#ff007f" text-anchor="end">O</text>
        <text x="43" y="-35" class="text-main" fill="#ff007f" font-weight="bold" filter="url(#glow)">CH₃ (Retained)</text>
        <text x="-43" y="35" class="text-main" fill="#ff007f" text-anchor="end">NH</text>
        <text x="0" y="80" class="text-title" fill="#ff007f" text-anchor="middle">Thymine</text>
        <text x="0" y="110" class="text-main" text-anchor="middle">Mismatch pairing: G</text>
    </g>
</svg>